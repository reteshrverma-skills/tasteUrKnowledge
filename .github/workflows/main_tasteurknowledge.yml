# Build and deploy to Azure App Service.
#
# The build runs HERE, on the GitHub runner (7 GB RAM), not on the App Service.
# The App Service plan (B1, ~1.75 GB) cannot compile this app in memory - the
# build was being OOM-killed ("Creating an optimized production build ...
# Killed"). The runner builds it, and the finished app is deployed.
#
# For this to work, the App Service must NOT try to rebuild on its own: set
#   SCM_DO_BUILD_DURING_DEPLOYMENT = false
# in the App Service configuration, or Oryx runs the build again and OOMs.

name: Build and deploy Node.js app to Azure Web App - tasteurknowledge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time placeholder only. `prisma generate` and `next build` do
          # not connect to a database; the real DATABASE_URL lives in the App
          # Service settings and is read at runtime.
          DATABASE_URL: 'postgresql://user:pass@localhost:5432/db'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tasteurknowledge'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C14C7517A0F144AB8294DA2007E72BE9 }}
